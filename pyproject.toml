[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linguaforge"
version = "0.1.0"
description = "From-scratch multilingual speech recognition and linguistic learning engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
]

# PyTorch install varies by platform (CPU / CUDA / MPS).
# Install it manually FIRST, then pip install -e .
# CPU:   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
# CUDA:  pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu121
# Mac:   pip install torch torchaudio

[project.optional-dependencies]
record = ["sounddevice>=0.4.6"]
dev    = ["pytest>=8.0", "ruff>=0.6", "jupyter>=1.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["speech_engine*", "linguistic_engine*", "learning_engine*", "tts_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
